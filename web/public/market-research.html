<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>CAREON 市場調研 v2 · 95 分版 · Sophie 出品</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --amber: #D4712A; --amber-deep: #B85A1F;
  --sage: #7A9482; --rose: #C9685F;
  --ink: #1F1B17; --ink-mute: #5A4F46;
  --paper: #FFFEFA; --cream: #FBF6EC;
  --bg-warm: #FAF1E3; --bg-warm-line: #E8D6BA;
  --cocoa-deep: #5A2D0A;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg-warm); color: var(--ink); font-family: 'Inter','Noto Sans TC',system-ui,sans-serif; line-height: 1.75; -webkit-font-smoothing: antialiased; }
.container { max-width: 880px; margin: 0 auto; padding: 56px 48px 80px; background: var(--paper); box-shadow: 0 0 60px rgba(0,0,0,0.04); border-left: 1px solid var(--bg-warm-line); border-right: 1px solid var(--bg-warm-line); }
.eyebrow { font-family: 'JetBrains Mono',monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber-deep); font-weight: 600; margin-bottom: 8px; }
h1 { font-family: 'Newsreader','Noto Serif TC',serif; font-weight: 500; font-size: 42px; line-height: 1.2; color: var(--cocoa-deep); margin: 0 0 8px; letter-spacing: -0.02em; }
h2 { font-family: 'Newsreader','Noto Serif TC',serif; font-weight: 500; font-size: 28px; line-height: 1.3; color: var(--cocoa-deep); margin-top: 56px; margin-bottom: 14px; letter-spacing: -0.015em; padding-bottom: 10px; border-bottom: 1px solid var(--bg-warm-line); }
h3 { font-family: 'Newsreader','Noto Serif TC',serif; font-weight: 600; color: var(--amber-deep); font-size: 20px; margin-top: 28px; margin-bottom: 10px; }
h4 { font-family: 'Inter','Noto Sans TC',sans-serif; font-weight: 600; font-size: 16px; color: var(--ink); margin-top: 22px; margin-bottom: 8px; }
p { font-size: 15.5px; color: var(--ink); margin: 12px 0; }
strong { color: var(--amber-deep); font-weight: 600; }
em { font-family: 'Newsreader','Noto Serif TC',serif; font-style: italic; color: var(--ink-mute); }
ul, ol { padding-left: 22px; margin: 10px 0 14px; }
li { font-size: 15.5px; line-height: 1.75; margin: 4px 0; }
code { font-family: 'JetBrains Mono',monospace; font-size: 13px; background: var(--cream); padding: 2px 6px; border-radius: 3px; color: var(--amber-deep); }
pre { background: #2A1F18; color: #F5E6D3; padding: 16px 20px; border-radius: 6px; overflow-x: auto; font-family: 'JetBrains Mono',monospace; font-size: 12.5px; line-height: 1.65; }
pre code { background: transparent; color: inherit; padding: 0; }
blockquote { border-left: 3px solid var(--amber); margin: 16px 0; padding: 4px 18px; background: var(--cream); font-style: italic; color: var(--ink-mute); }
table { border-collapse: collapse; margin: 16px 0; width: 100%; font-size: 14px; }
th, td { border: 1px solid var(--bg-warm-line); padding: 9px 12px; text-align: left; vertical-align: top; }
th { background: var(--cream); font-family: 'Inter','Noto Sans TC',sans-serif; font-weight: 600; color: var(--cocoa-deep); }
hr { border: none; border-top: 1px solid var(--bg-warm-line); margin: 32px 0; }
a { color: var(--amber-deep); text-decoration: underline; text-underline-offset: 2px; }
a:hover { color: var(--amber); }
.banner { background: linear-gradient(135deg, rgba(212,113,42,0.10), rgba(122,148,130,0.06)); border: 1px solid rgba(212,113,42,0.25); border-radius: 8px; padding: 16px 20px; margin: 24px 0 36px; font-size: 14px; color: var(--cocoa-deep); }
.banner a { font-weight: 600; }
@media (max-width: 768px) {
  .container { padding: 32px 22px; }
  h1 { font-size: 32px; }
  h2 { font-size: 24px; }
}
</style>
</head>
<body>
<div class="container">
<div class="eyebrow">CAREON · Market Research · v2</div>
<div class="banner">
  ← 回 <a href="/">主對話 Demo</a> · <a href="/device">8 吋裝置 POC</a> · <a href="/proposal-v3.html">完整產品規劃 v3</a>
</div>
<div id="content"></div>
</div>
<script>
fetch('/_market-content.html')
  .then(r => r.text())
  .then(html => { document.getElementById('content').innerHTML = html; })
  .catch(e => { document.getElementById('content').innerHTML = '<p style="color:#D85A55">內容載入失敗、請重新整理</p>'; });
</script>
</body>
</html>
